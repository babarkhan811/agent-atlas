<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Atlas · See how AI agents work</title>
  <meta name="description" content="Watch AI agents work, message by message. Interactive simulations of LLMs, tool use, RAG, MCP, multi-agent systems, automation and AI-driven cybersecurity, with every message decoded field by field." />
  <meta name="theme-color" content="#05080f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305080f'/%3E%3Cpath d='M16 5l10 6v10l-10 6-10-6V11z' fill='none' stroke='%2338bdf8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23a78bfa'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell" id="shell">
    <header class="top">
      <button class="icon-btn menu" id="menu" type="button" aria-label="Open lesson list">☰</button>
      <a class="brand" href="#/" aria-label="Agent Atlas home">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 3l18 10.5v21L24 45 6 34.5v-21z" fill="none" stroke="var(--accent)" stroke-width="2"/>
          <path d="M24 3v21m0 0l18-10.5M24 24L6 13.5M24 24v21" stroke="var(--line-2)" stroke-width="1.4"/>
          <circle cx="24" cy="24" r="5" fill="var(--accent-2)"/>
          <circle cx="24" cy="24" r="9" fill="none" stroke="var(--accent-2)" stroke-opacity=".45"/>
        </svg>
        <span class="brand-text"><b>AGENT ATLAS</b><small>SEE HOW AI AGENTS WORK</small></span>
      </a>
      <div class="stack" id="stack" aria-label="Agent stack layers"></div>
      <div class="top-right">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="q" type="search" placeholder="Search lessons" autocomplete="off" />
          <kbd>Ctrl K</kbd>
        </label>
        <a class="toplink" href="#/guide">Build guide</a>
        <a class="toplink" href="#/glossary">Glossary</a>
        <button id="theme" class="icon-btn" type="button" aria-label="Toggle light and dark theme">☾</button>
      </div>
    </header>

    <aside class="side panel" id="side">
      <div class="panel-title">LESSONS <span id="count"></span></div>
      <div class="tabs" id="tabs"></div>
      <nav class="list" id="list"></nav>
    </aside>

    <section class="stage panel" id="stage"></section>
    <aside class="inspector panel" id="inspector"></aside>
    <section class="trace panel" id="trace"></section>
    <main class="page panel" id="page"></main>
  </div>
  <div class="scrim" id="scrim"></div>

  <script src="lessons.js"></script>
  <script src="guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
