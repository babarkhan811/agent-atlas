name: Update visual baselines

# Run manually after an intentional design change. Regenerates the Linux
# screenshots in tests/visual and commits them to the selected branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=visual --update-snapshots
        env:
          VISUAL: "1"
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          git diff --cached --quiet || git commit -m "test: update visual baselines"
          git push
